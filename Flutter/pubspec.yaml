name: airguard_mobile
description: "AirGuard — IoT-Based Hyperlocal Air Quality Monitoring & Alert System Mobile Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & Real-Time
  http: ^1.2.1
  socket_io_client: ^2.0.3+1

  # State Management & Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # UI, Charts & Formatting
  intl: ^0.19.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8

  # Location & GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
