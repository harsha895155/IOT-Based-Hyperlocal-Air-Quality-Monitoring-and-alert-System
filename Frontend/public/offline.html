<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirGuard — Offline Mode</title>
    <style>
      :root {
        --bg: #070a10;
        --card-bg: #0d131f;
        --border: #1e293b;
        --text: #f8fafc;
        --text-sub: #94a3b8;
        --accent: #0284c7;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .offline-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 40px 24px;
        max-width: 440px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .icon {
        font-size: 54px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
        color: var(--text);
      }
      p {
        font-size: 14px;
        color: var(--text-sub);
        line-height: 1.6;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        background: var(--accent);
        color: #ffffff;
        padding: 12px 28px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: background 0.2s ease;
      }
      .btn:hover {
        background: #0369a1;
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="icon">📡</div>
      <h1>AirGuard Offline Mode</h1>
      <p>
        You are currently disconnected from the internet. Your local cached sensor
        telemetry and saved air quality metrics remain safely stored on this device.
      </p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
